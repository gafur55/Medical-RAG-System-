# Every document the Mohs RAG system can search.
#
# ingest.py indexes the entries with `enabled: true`, and nothing else gets
# indexed. Every entry has to state its license, so adding a source is a
# deliberate act (see src/sources.py and docs/sources.md).
#
# Fields
#   id       lowercase letters, digits, underscores. Stored on every chunk.
#   title    full title
#   label    short name shown in citations, e.g. "[2] StatPearls: Mohs AUC"
#   type     textbook | guideline | review | policy | protocol | article
#   domain   clinical | operations - retrieval and the app can filter on it
#   format   pdf_textbook | pdf | html | nxml | docx | markdown - picks the loader
#   path     file location, relative to the project root. data/raw/ is gitignored.
#   license  terms of use, in words
#   url      where the file came from
#   year     publication or last-update year
#   enabled  true to index it
#   notes    how to get it, caveats
#   options  loader settings (rarely needed; see src/loaders.py)
#
# After editing:   python3 -m src.ingest && python3 -m src.embed
# Status check:    python3 -m src.ingest --list
#
# Not listed on purpose:
#   NCCN Guidelines - the NCCN license explicitly bars using its content as
#     input to any AI system (nccn.org/end-user-license-agreement).
#   2012 Mohs AUC (AAD/ACMS/ASDSA/ASMS) - copyrighted. Index it only with the
#     AAD's permission; until then the StatPearls AUC article below covers it.
#
# Licenses below were checked on 2026-10-13. Re-check each page before
# enabling an entry - this is a starting point, not legal advice.

sources:

  # --------------------------------------------------------------- textbook
  - id: mohs_layers
    title: "Mohs Micrographic Surgery: From Layers to Reconstruction"
    label: "Mohs textbook"
    type: textbook
    domain: clinical
    format: pdf_textbook
    path: data/raw/MOHS_MICROGRAPHIC_SURGERY_from_layers_to_reconstruction.pdf
    license: "Copyrighted. Licensed copy for local use - never commit the PDF or publish its text."
    enabled: true

  # ------------------------------------------------------------- StatPearls
  # Mohs series on NCBI Bookshelf. CC BY-NC-ND 4.0: non-commercial use,
  # credit the authors, no altered versions - quote, do not rewrite.
  # Getting the files: save each page by hand (browser File > Save Page As,
  # "Webpage, HTML only") into data/raw/statpearls/. Bookshelf forbids
  # scripted bulk downloads from the website; the only allowed bulk route is
  # the NLM LitArch FTP (ftp.ncbi.nlm.nih.gov/pub/litarch/ - look the NBK ids
  # up in file_list.csv). If you get the .nxml files that way, change
  # `format: nxml` and the path's extension.

  - id: statpearls_mohs
    title: "Mohs Micrographic Surgery (StatPearls)"
    label: "StatPearls: Mohs surgery"
    type: review
    domain: clinical
    format: html
    path: data/raw/statpearls/NBK441833.html
    url: https://www.ncbi.nlm.nih.gov/books/NBK441833/
    license: "CC BY-NC-ND 4.0"
    enabled: false

