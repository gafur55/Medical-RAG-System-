    type: review
    domain: clinical
    format: html
    path: data/raw/nci/skin-treatment-pdq-hp.html
    url: https://www.cancer.gov/types/skin/hp/skin-treatment-pdq
    license: >-
      NCI text is free of copyright - credit the National Cancer Institute.
      Images are not reusable. Excerpts may not be presented as an official
      PDQ summary.
    enabled: false
    notes: "BCC and cSCC treatment options, staging, risk factors. Updated several times a year."

  # --------------------------------------------------------- clinic documents
  # Your own protocols. Keep them in data/raw/protocols/ (gitignored), never
  # in the repo, and never index anything containing patient information.
  - id: clinic_protocols_example
    title: "Clinic protocol (example entry)"
    label: "Clinic protocol"
    type: protocol
    domain: operations
    format: docx
    path: data/raw/protocols/example.docx
    license: "Internal - clinic use only. Never commit."
    enabled: false
    notes: "Copy this entry once per document. format: markdown also works for .md / .txt files."
