  # --------------------------------------------------------- Medicare (CMS)
  # US government works, public domain - but CPT code descriptions inside
  # them are AMA-copyrighted. Coverage rules differ by Medicare contractor.

  - id: cms_ncci_ch3_2026
    title: "Medicare NCCI Policy Manual, Chapter III - Surgery: Integumentary System (2026)"
    label: "NCCI manual ch. III (2026)"
    type: policy
    domain: operations
    format: pdf
    path: data/raw/cms/ncci_ch3_2026.pdf
    url: https://www.cms.gov/files/document/03-chapter3-ncci-medicare-policy-manual-2026-final.pdf
    license: "US government work (public domain). CPT descriptors are AMA-copyrighted."
    year: 2026
    enabled: false
    notes: >-
      Mohs bundling rules: what 17311-17315 include, when a same-day
      diagnostic biopsy is separately reportable, repairs billed separately.
      CMS publishes a new edition every January.

  - id: cms_lcd_mohs
    title: "Mohs Micrographic Surgery - Local Coverage Determination (your Medicare contractor)"
    label: "Medicare LCD: Mohs"
    type: policy
    domain: operations
    format: html
    path: data/raw/cms/lcd_mohs.html
    url: https://www.cms.gov/medicare-coverage-database/search.aspx
    license: "US government work (public domain). CPT descriptors are AMA-copyrighted."
    enabled: false
    notes: >-
      Search the Medicare Coverage Database for "Mohs Micrographic Surgery"
      and pick your contractor's LCD. Examples: L33689 (First Coast),
      L34961 (Novitas), L35494, L35702 / L35704 (Noridian JE / JF). I could
      not confirm one for NGS (J6, includes Illinois). Save the page as HTML.

  - id: cms_billing_mohs
    title: "Billing and Coding: Mohs Micrographic Surgery (your Medicare contractor)"
    label: "Medicare billing article: Mohs"
    type: policy
    domain: operations
    format: html
    path: data/raw/cms/billing_mohs.html
    url: https://www.cms.gov/medicare-coverage-database/search.aspx
    license: "US government work (public domain). CPT descriptors are AMA-copyrighted."
    enabled: false
    options:
      skip_tables: true
    notes: >-
      The billing and coding article that goes with your LCD (e.g. A57767
      for L33689, A57477 for L35494). Its long ICD-10 tables are skipped
      (skip_tables) - they bury the prose rules in search results.

  # ---------------------------------------------------------------- NCI PDQ
  - id: pdq_skin_cancer_treatment_hp
    title: "Skin Cancer Treatment (PDQ) - Health Professional Version"
